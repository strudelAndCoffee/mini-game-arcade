<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" type="module" defer></script>
  <title>vvordle</title>
</head>

<body>
  <div class="stats-block">
    <div class="stats-header">global stats</div>
    <div>total games played: <span id="total-games"></span></div>
    <div>games won: <span id="games-won"></span></div>
    <div>win percentage: <span id="win-percentage"></span></div>
    <div>1st try: <span id="1st-try"></span></div>
    <div>2nd try: <span id="2nd-try"></span></div>
    <div>3rd try: <span id="3rd-try"></span></div>
    <div>4th try: <span id="4th-try"></span></div>
    <div>5th try: <span id="5th-try"></span></div>
    <div>last try: <span id="last-try"></span></div>
    <div>total points: <span id="total-points"></span></div>
    <div>avg. pts. per game: <span id="points-per-game"></span></div>
    <div class="stats-header">current game</div>
    <div>green letters: <span id="green-letters"></span></div>
    <div>yellow letters: <span id="yellow-letters"></span></div>
    <div>valid guesses: <span id="valid-guesses"></span></div>
    <div>unbound guesses: <span id="unbound-guesses"></span></div>
    <div>current try: <span id="current-try"></span></div>
  </div>
  <div class="alert-container" data-alert-container></div>
  <div class="guess-grid" data-guess-grid>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
  </div>
  <div class="keyboard" data-keyboard>
    <button class="key" data-key="Q">Q</button>
    <button class="key" data-key="W">W</button>
    <button class="key" data-key="E">E</button>
    <button class="key" data-key="R">R</button>
    <button class="key" data-key="T">T</button>
    <button class="key" data-key="Y">Y</button>
    <button class="key" data-key="U">U</button>
    <button class="key" data-key="I">I</button>
    <button class="key" data-key="O">O</button>
    <button class="key" data-key="P">P</button>
    <div class="space"></div>
    <button class="key" data-key="A">A</button>
    <button class="key" data-key="S">S</button>
    <button class="key" data-key="D">D</button>
    <button class="key" data-key="F">F</button>
    <button class="key" data-key="G">G</button>
    <button class="key" data-key="H">H</button>
    <button class="key" data-key="J">J</button>
    <button class="key" data-key="K">K</button>
    <button class="key" data-key="L">L</button>
    <div class="space"></div>
    <button class="key large" data-enter>ENTER</button>
    <button class="key" data-key="Z">Z</button>
    <button class="key" data-key="X">X</button>
    <button class="key" data-key="C">C</button>
    <button class="key" data-key="V">V</button>
    <button class="key" data-key="B">B</button>
    <button class="key" data-key="N">N</button>
    <button class="key" data-key="M">M</button>
    <button class="key large delete" data-delete>
      <span class="angle"></span><span class="times">&times;</span>
    </button>
  </div>
</body>

</html>
